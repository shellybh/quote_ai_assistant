[project]
name = "price-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "crewai[google-genai]>=1.15.33",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
