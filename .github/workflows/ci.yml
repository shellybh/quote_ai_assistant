name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # Tests use fake settings and a fake LLM; no secrets, no Gemini calls.
      - run: uv run pytest -q
      - run: uv run python scripts/check_demo_data.py
